<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Apply a saved light/dark choice before the page paints (no saved choice = follow the device)
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-sans-normal-300-700-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/ibm-plex-mono-normal-400-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% seo %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#eceff4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2e3440" media="(prefers-color-scheme: dark)">
</head>
<body class="{% if page.url == '/' %}is-home{% endif %}">
  <header class="masthead">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="logo-light" src="{{ '/assets/logo/icmns_mark_small-light.svg' | relative_url }}" alt="" width="44" height="44">
        <img class="logo-dark" src="{{ '/assets/logo/icmns_mark_small-dark.svg' | relative_url }}" alt="" width="44" height="44">
        <span>{{ site.title }}</span>
      </a>
      <nav class="nav" aria-label="Main">
        {% for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
        <button class="theme" type="button" aria-label="Colour theme: automatic" title="Colour theme: automatic">
          <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
          <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>&copy; {{ 'now' | date: '%Y' }} {{ site.long_title }}</span>
      <span><a href="mailto:{{ site.email }}">{{ site.email }}</a> &middot; <a href="{{ '/feed.xml' | relative_url }}">News feed</a> &middot; <a href="{{ '/colophon/' | relative_url }}">Colophon</a></span>
    </div>
  </footer>

  <script>
    // Light/dark switch: cycles automatic → light → dark; remembered on this device only
    (function () {
      var root = document.documentElement, btn = document.querySelector('.theme');
      var order = ['auto', 'light', 'dark'], names = { auto: 'automatic', light: 'light', dark: 'dark' };
      function current() { return root.dataset.theme || 'auto'; }
      function show(mode) {
        btn.dataset.mode = mode;
        btn.setAttribute('aria-label', 'Colour theme: ' + names[mode]);
        btn.title = 'Colour theme: ' + names[mode];
      }
      btn.addEventListener('click', function () {
        var next = order[(order.indexOf(current()) + 1) % order.length];
        if (next === 'auto') delete root.dataset.theme; else root.dataset.theme = next;
        try { if (next === 'auto') localStorage.removeItem('theme'); else localStorage.setItem('theme', next); } catch (e) {}
        show(next);
      });
      show(current());
    })();
  </script>
</body>
</html>
