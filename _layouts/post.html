---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
  {{ content }}
  <p class="post-back"><a href="{{ '/news/' | relative_url }}">← All news</a></p>
</article>
