name: Build and deploy the site

# Every branch and pull request is built (so mistakes show up before they go live);
# only the main branch is published to icmns.org.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly rebuild, so date-based statuses stay current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Maths: typeset any $$...$$ formula that has no SVG in _maths/ yet, so editors
      # can write equations on github.com without installing LaTeX themselves.
      - uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-2026-xetex-plex-firamath-v1
      - name: Install a minimal TeX Live (cached after the first run)
        run: |
          if [ ! -x ~/texlive/bin/x86_64-linux/xelatex ]; then
            cd "$RUNNER_TEMP"
            curl -sSL https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz | tar xz
            printf '%s\n' "selected_scheme scheme-infraonly" "TEXDIR $HOME/texlive" \
              "tlpdbopt_install_docfiles 0" "tlpdbopt_install_srcfiles 0" "tlpdbopt_autobackup 0" > profile
            install-tl-*/install-tl --profile profile --no-interaction > /dev/null
            ~/texlive/bin/x86_64-linux/tlmgr install latex-bin xetex amsmath unicode-math \
              lualatex-math fontspec l3packages iftex lm plex firamath dvisvgm > /dev/null
          fi
          echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
      - name: Typeset maths
        run: python3 tools/render_maths.py
        continue-on-error: true    # if LaTeX fails, still build: missing formulas show in red

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
