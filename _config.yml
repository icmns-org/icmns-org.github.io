title: ICMNS
long_title: International Conference on Mathematical Neuroscience
description: >-
  The International Conference on Mathematical Neuroscience (ICMNS) brings together
  mathematicians, physicists, computational and experimental neuroscientists.
url: "https://icmns.org"
baseurl: ""
lang: en

# Link-preview card (Open Graph / social media), used by jekyll-seo-tag
logo: /assets/logo/icmns_mark_512.png
twitter:
  card: summary_large_image

# Contact address shown in the footer (TODO: replace)
email: info@icmns.org

# Announcements mailing list (home page button)
mailing_list: https://listserver.vu.nl/mailman/listinfo/icmns-beta

# Current edition, used on the home page
current_edition: 2027

# News posts live in _posts/ as YYYY-MM-DD-title.md
permalink: /news/:year/:month/:day/:title/

feed:
  path: feed.xml

collections:
  editions:
    output: true
    permalink: /:name/

defaults:
  - scope: { path: "" }
    values:
      layout: default
      image: /assets/logo/og-image.png
  - scope: { path: "", type: editions }
    values: { layout: edition }
  - scope: { path: "", type: posts }
    values: { layout: post }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

exclude: [README.md, CONTRIBUTING.md, Gemfile, Gemfile.lock, vendor, tools]
